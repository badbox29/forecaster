<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#EBEFF3" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0F1726" media="(prefers-color-scheme: dark)">
  <meta name="referrer" content="no-referrer">
  <title>Forecast</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='12' fill='none' stroke='%232A64A8' stroke-width='4'/%3E%3Cpath d='M16 16 L16 6' stroke='%23C2412F' stroke-width='3' stroke-linecap='round'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600;12..96,700&family=Public+Sans:wght@400;500;600&display=swap">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <div id="gate" class="gate" hidden></div>

  <div id="app" hidden>
    <header class="top">
      <div class="top-row">
        <div class="brand" id="brand"></div>
        <button class="icon-btn" id="settingsBtn" type="button" aria-label="Settings"></button>
      </div>
      <nav class="tabs" id="tabs" role="tablist" aria-label="Forecasts"></nav>
    </header>
    <main id="main"></main>
  </div>

  <div id="overlay" hidden></div>
  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

  <script src="js/core.js"></script>
  <script src="js/vault.js"></script>
  <script src="js/advisory.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
